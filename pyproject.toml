[project]
name = "sf6viewer"
version = "2.4.1"
requires-python = ">=3.12.13"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.139.2",
    "playwright>=1.61.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pywebview>=6.2.1",
    "pywin32>=312 ; sys_platform == 'win32'",
    "sqlalchemy>=2.0.51",
    "tzdata>=2026.3",
    "ulid-py>=1.1.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "types-psutil>=7.2.2.20260518",
]

[build-system]
requires = ["uv_build>=0.9.23,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.mypy]
strict = true
mypy_path = "src"
